name: Apply ask-school search performance patch

on:
  push:
    branches: [codex/assistant-attachments-v2]
    paths:
      - tools/apply-assistant-search-performance-patch.py
      - tests/test_assistant_search_performance.js
      - .github/workflows/apply-assistant-search-performance.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: codex/assistant-attachments-v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply performance patch
        run: python tools/apply-assistant-search-performance-patch.py
      - name: Run precision regression
        run: node tests/test_assistant_attachment_qa.js
      - name: Run 5k search benchmark
        run: node tests/test_assistant_search_performance.js
      - name: Commit optimized search
        run: |
          if git diff --quiet -- docs/assistant-qa.js; then
            echo "PATCH_ALREADY_APPLIED"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/assistant-qa.js
          git commit -m "perf: shortlist ask-school candidates before detail scan"
          git push origin HEAD:codex/assistant-attachments-v2
