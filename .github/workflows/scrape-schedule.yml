name: 排程啟動兩校公告抓取

on:
  schedule:
    # UTC: 23:10 = Taiwan 07:10; 00:10–11:10 = 08:10–19:10;
    # 13:10 = Taiwan 21:10. Keep the existing frequency unchanged.
    - cron: '10 23,0-11,13 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape:
    uses: ./.github/workflows/scrape-hourly.yml
    with:
      fetch_all: false
    secrets: inherit
