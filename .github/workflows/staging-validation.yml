name: Staging validation

on:
  push:
    branches: [feature/personal-assistant-v1, staging, codex/assistant-validity-gate, codex/username-password-login, codex/integrated-v11, codex/account-roles-email, codex/pksh-windows-research-v12, codex/fix-formal-timetable-discovery]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.1.4
      - name: Install parser dependencies
        run: pip install -r scraper/requirements.txt
      - name: Timetable parser regression
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python tests/test_parser.py
          python tests/test_timetable_adapter.py
      - name: Live formal timetable discovery
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python scraper/timetable.py discover
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("docs/data/class-timetables.json").read_text(encoding="utf-8"))
          row = next(
              item for item in data["timetables"]
              if item.get("school_id") == "cysh"
              and item.get("academic_year") == 115
              and item.get("semester") == 1
          )
          assert row["version"] == "formal", row["version"]
          assert row["source_url"].lower().endswith(".pdf"), row["source_url"]
          assert len(row["classes"]) == 60, len(row["classes"])
          assert all(len(item.get("slots") or []) == 40 for item in row["classes"])
          print("LIVE_FORMAL_TIMETABLE_OK", len(row["classes"]))
          PY
      - name: Node regression
        run: >-
          node --test
          tests/test_account_auth.js
          tests/test_admin_account_contract.js
          tests/test_account_approval_rls_contract.js
          tests/test_account_roles_contract.js
          tests/test_timetable_only_sync.js
          tests/test_username_auth_contract.js
          tests/test_account_switch_v3.js
          tests/test_account_sync.js
          tests/test_supabase_sync.js
          tests/test_account_security.js
          tests/test_rls_deployed_contract.js
          tests/test_pwa_notification.js
          tests/test_profile.js
          tests/test_relevance.js
          tests/test_assistant_qa.js
          tests/test_search_ranking.js
          tests/test_nonmember_content_gate.js
          tests/test_member_content_rls_contract.js
          tests/test_production_release_evidence.js
          tests/test_announcement_validity.js
          tests/test_reviewed_validity_cases.js
          tests/test_calendar_state.js
          tests/test_calendar_persistence.js
          tests/test_task_state.js
          tests/test_today.js
          tests/test_detail_ui.js
          tests/test_reminder_rules.js
          tests/test_reminder_schema.js
          tests/test_reminder_worker.js
          tests/test_reminder_scheduler.js
          tests/test_reminder_historical_flood.js
          tests/test_reminder_target_sync.js
          tests/test_push_subscription.js
          tests/test_closed_app_push.js
          tests/test_user_refresh.js
          tests/test_reminder_rules_client.js
          tests/test_staging_build.js
          tests/test_pksh_staging_overlay.js
          tests/test_ui_visual_contract.js
          tests/test_calendar_workflow.js
      - name: Search ranking train and holdout gate
        run: node tools/evaluate-search-ranking.js --strict
      - name: Assistant QA train and holdout gate
        run: node tools/evaluate-assistant-qa.js --strict
      - name: Legal and privacy preview gate
        run: node tools/check-legal-compliance.js
      - name: Type-check reminder Edge Function
        run: >-
          deno check
          --config supabase/functions/reminder-worker/deno.json
          supabase/functions/reminder-worker/index.ts
      - name: Type-check reminder target sync function
        run: >-
          deno check
          --config supabase/functions/reminder-target-sync/deno.json
          supabase/functions/reminder-target-sync/index.ts
      - name: Type-check authenticated staging refresh function
        run: >-
          deno check
          --config supabase/functions/request-staging-refresh/deno.json
          supabase/functions/request-staging-refresh/index.ts
      - name: Type-check username/password login function
        run: >-
          deno check
          --config supabase/functions/username-auth/deno.json
          supabase/functions/username-auth/index.ts
      - name: Type-check account email worker
        run: >-
          deno check
          --config supabase/functions/account-email-worker/deno.json
          supabase/functions/account-email-worker/index.ts
      - name: Type-check announcement content sync
        run: >-
          deno check
          --config supabase/functions/announcement-content-sync/deno.json
          supabase/functions/announcement-content-sync/index.ts
      - name: Python parser and calendar regression
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python tests/test_parser.py
          python tests/test_calendar_adapter.py
          python tests/test_detail_parser.py
          python tests/test_detail_backfill.py
          python tests/test_attachment_parser.py
          python tests/test_reminder_targets.py
          python tests/test_pksh_adapter.py
          python tests/test_pksh_windows_handoff.py
          python tests/test_pksh_member_content.py
      - name: Verify generated data is untouched by staging build
        run: git diff --exit-code -- docs/data scraper/fetch_state.json
      - name: Reject tracked secret patterns
        run: |
          if git grep -n -I -E '(sb_secret_|eyJ[A-Za-z0-9_-]{20,}\.|postgres(ql)?://[^[:space:]]+:[^[:space:]]+@|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----)' -- ':!.github/workflows/staging-validation.yml'; then
            echo "Potential tracked secret detected"
            exit 1
          fi

  pksh-windows-live:
    if: >-
      (github.ref == 'refs/heads/codex/pksh-windows-research-v12' ||
      github.head_ref == 'codex/pksh-windows-research-v12') &&
      !contains(github.event.head_commit.message, 'Update PKSH staging snapshot')
    runs-on: windows-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install parser dependencies
        run: pip install -r scraper/requirements.txt
      - name: Verify offline PKSH contracts
        run: |
          python tests/test_pksh_adapter.py
          python tests/test_pksh_windows_handoff.py
      - name: Fetch PKSH with Windows certificate validation
        shell: pwsh
        run: >-
          ./scraper/pksh_windows_fetch.ps1
          -OutputPath "$env:RUNNER_TEMP/pksh-list.json"
          -ReportPath "$env:RUNNER_TEMP/pksh-transport.json"
          -MemberOutputPath "$env:RUNNER_TEMP/pksh-member-source.json"
      - name: Produce metadata-only handoff
        shell: pwsh
        run: >-
          python tools/pksh_snapshot.py
          --html "$env:RUNNER_TEMP/pksh-list.json"
          --output "$env:RUNNER_TEMP/pksh-metadata.json"
      - name: Prepare protected PKSH summaries
        shell: pwsh
        run: >-
          python tools/pksh_member_content.py
          --input "$env:RUNNER_TEMP/pksh-member-source.json"
          --output "$env:RUNNER_TEMP/pksh-member-sync.json"
      - name: Sync summaries to the protected staging backend when configured
        shell: pwsh
        env:
          SYNC_TOKEN: ${{ secrets.STAGING_ANNOUNCEMENT_CONTENT_SYNC_TOKEN }}
          SYNC_URL: ${{ vars.STAGING_ANNOUNCEMENT_CONTENT_SYNC_URL }}
          PUBLISHABLE_KEY: ${{ vars.STAGING_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if (-not $env:SYNC_TOKEN -or -not $env:SYNC_URL -or -not $env:PUBLISHABLE_KEY) {
            Write-Host "PKSH_STAGING_MEMBER_SYNC_NOT_CONFIGURED"
            exit 0
          }
          Invoke-WebRequest -Uri $env:SYNC_URL -Method Post -Headers @{
            authorization = "Bearer $env:PUBLISHABLE_KEY"
            apikey = $env:PUBLISHABLE_KEY
            "x-announcement-content-sync-token" = $env:SYNC_TOKEN
          } -ContentType "application/json" -InFile "$env:RUNNER_TEMP/pksh-member-sync.json" -TimeoutSec 30 -UseBasicParsing | Out-Null
      - name: Save PKSH snapshot for the research Preview
        shell: pwsh
        env:
          TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          New-Item -ItemType Directory -Force -Path staging-data | Out-Null
          Copy-Item "$env:RUNNER_TEMP/pksh-metadata.json" "staging-data/pksh-metadata.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add staging-data/pksh-metadata.json
          if (git diff --cached --quiet) {
            Write-Host "PKSH staging snapshot is unchanged."
          } else {
            git commit -m "Update PKSH staging snapshot"
            git push origin "HEAD:$env:TARGET_BRANCH"
          }
      - name: Upload bounded research evidence
        uses: actions/upload-artifact@v4
        with:
          name: pksh-windows-research-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/pksh-transport.json
            ${{ runner.temp }}/pksh-metadata.json
          retention-days: 7
