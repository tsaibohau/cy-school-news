name: FJSH live acceptance

on:
  push:
    branches: [feature/personal-assistant-v1]
    paths:
      - .github/workflows/fjsh-live-acceptance.yml
      - scraper/scrape.py
      - scraper/config.json
      - tests/test_parser.py
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  live-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install scraper dependencies
        run: pip install -r scraper/requirements.txt
      - name: Run normal hot pipeline without notifications or commits
        env:
          HOT_ONLY: '1'
          ATTACHMENT_PDF_CAP: '0'
          PYTHONIOENCODING: utf-8
        run: python scraper/scrape.py
      - name: Verify real FJSH output and regressions
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from urllib.parse import urlsplit

          payload = json.loads(Path('docs/data/announcements.json').read_text(encoding='utf-8'))
          items = payload['items']
          counts = {school: sum(x.get('school') == school for x in items)
                    for school in ('cysh', 'cygsh', 'fjsh')}
          assert all(counts.values()), counts
          fjsh = [x for x in items if x.get('school') == 'fjsh']
          assert len({x.get('source_id') for x in fjsh}) == len(fjsh), 'duplicate FJSH source_id'
          dated = [item for item in fjsh if item.get('date')]
          assert len(dated) >= 5, {'counts': counts, 'dated_fjsh': len(dated)}
          assert sum(bool(item.get('detail_available')) for item in dated) >= 5, 'five FJSH details required'
          for item in dated[:5]:
              assert item.get('source_id', '').startswith('fjsh:'), item
              assert item.get('id', '').startswith('fjsh-'), item
              assert item.get('title'), item
              parsed = urlsplit(item.get('url', ''))
              assert parsed.scheme == 'https' and parsed.hostname == 'rpage.fjsh.cy.edu.tw', item
          detail_files = list(Path('docs/data/details/fjsh').glob('*.json'))
          assert any(json.loads(path.read_text(encoding='utf-8')).get('attachments') for path in detail_files), 'FJSH attachment required'
          print(json.dumps({'counts': counts, 'sample_ids': [x['source_id'] for x in dated[:5]]}, ensure_ascii=False))
          PY
      - name: Confirm generated data was not committed
        run: git diff -- docs/data scraper/fetch_state.json
