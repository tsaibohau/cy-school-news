name: 一次性校網普查（雲嘉）

# 只在 claude/census-yunchia 分支觸發；用完即移除，不進排程。
on:
  push:
    branches: [claude/census-yunchia]
    paths:
      - "tools/school_census.py"
      - "tools/census/**"
      - ".github/workflows/census-once.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: census-once
  cancel-in-progress: false

jobs:
  census:
    if: github.ref == 'refs/heads/claude/census-yunchia'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -r scraper/requirements.txt
      - name: Offline tests
        run: python tests/test_school_census.py
      - name: Census (low rate)
        run: python tools/school_census.py
      - name: Commit report to this branch
        run: |
          git config user.name "news-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/census
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "普查報告：雲嘉地區校網系統"
          git pull --rebase origin claude/census-yunchia
          git push origin HEAD:claude/census-yunchia
