name: 抓取兩校公告

on:
  push:
    branches: [main]
    paths:
      - "scraper/**"
      - ".github/workflows/scrape-hourly.yml"
  workflow_dispatch:
    inputs:
      fetch_all:
        description: "Fetch cold sources and history too"
        required: false
        default: true
        type: boolean
  workflow_call:
    inputs:
      fetch_all:
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  # Open/close the 自動抓取失敗 issue so failures are never silent.
  issues: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    # A stuck source must not keep the shared scrape queue occupied and make
    # later scheduled runs appear stale to readers.
    # 2026-11-01: 28 → 58 校（台南、高雄上架），一次約 13 分鐘會變成約 25 分鐘；上限放寬到 35 分鐘，仍在下一次排程前結束。
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: 安裝相依套件
        run: pip install -r scraper/requirements.txt

      - name: 取得管理員刪除紀錄
        env:
          ANNOUNCEMENT_CONTENT_SYNC_TOKEN: ${{ secrets.ANNOUNCEMENT_CONTENT_SYNC_TOKEN }}
          ANNOUNCEMENT_CONTENT_SYNC_URL: ${{ vars.ANNOUNCEMENT_CONTENT_SYNC_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          tombstone_file="$RUNNER_TEMP/announcement-tombstones.json"
          if [ -z "$ANNOUNCEMENT_CONTENT_SYNC_TOKEN" ] || [ -z "$ANNOUNCEMENT_CONTENT_SYNC_URL" ] || [ -z "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo '{"deleted_ids":[]}' > "$tombstone_file"
            echo "ANNOUNCEMENT_TOMBSTONES_NOT_CONFIGURED"
          else
            curl --fail --silent --show-error --request GET "$ANNOUNCEMENT_CONTENT_SYNC_URL" \
              --header "apikey: $SUPABASE_PUBLISHABLE_KEY" \
              --header "x-announcement-content-sync-token: $ANNOUNCEMENT_CONTENT_SYNC_TOKEN" \
              --output "$tombstone_file"
          fi
          python -c 'import json,sys; p=json.load(open(sys.argv[1], encoding="utf-8")); assert isinstance(p.get("deleted_ids"), list)' "$tombstone_file"
          echo "ANNOUNCEMENT_TOMBSTONES_PATH=$tombstone_file" >> "$GITHUB_ENV"

      - name: 執行爬蟲
        env:
          # Direct manual runs may request a full crawl. The scheduled driver
          # keeps the established hot/cold behaviour by passing false.
          FETCH_ALL: ${{ inputs.fetch_all && '1' || '' }}
        run: python scraper/scrape.py

      - name: 逐步補齊問校務受保護資料
        env:
          # Keep school load bounded. Article pages advance with a persisted
          # cursor; attachment downloads share an even smaller per-run cap.
          DETAIL_BACKFILL_CAP: '4'
          ATTACHMENT_PDF_CAP: '2'
        run: python scraper/detail_backfill.py

      - name: 更新公開班級課表
        run: python scraper/timetable.py discover

      - name: 更新校園資訊與學生手冊（每次少量頁面）
        # Pages are refreshed at most every 30 days and the handbook list every 14 days,
        # so each run makes only a handful of extra requests. A failure must not block
        # the announcement update.
        continue-on-error: true
        # All 28 schools share a fixed time budget, the least recently updated school first.
        env:
          SCHOOL_INFO_PAGE_CAP: '10'
          SCHOOL_INFO_PDF_CAP: '2'
          SCHOOL_INFO_TIME_BUDGET_SEC: '240'
        run: python scraper/school_info.py discover

      - name: 推播新公告 (ntfy)
        env:
          # Secret first (topic URL or name), then legacy repository variable.
          # The value must never be echoed to Actions logs.
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC || vars.NTFY_TOPIC }}
          NTFY_URL: ${{ secrets.NTFY_URL || vars.NTFY_URL }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: python scraper/notify.py

      - name: 產生訂閱行事曆
        run: python scraper/schoolcal.py build

      - name: 產生可信提醒目標清單
        run: python scraper/reminder_targets.py

      - name: 準備會員摘要並同步到受保護資料庫（已設定時）
        env:
          ANNOUNCEMENT_CONTENT_SYNC_TOKEN: ${{ secrets.ANNOUNCEMENT_CONTENT_SYNC_TOKEN }}
          ANNOUNCEMENT_CONTENT_SYNC_URL: ${{ vars.ANNOUNCEMENT_CONTENT_SYNC_URL }}
          # The Edge Function validates this opaque key together with the private sync token.
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          node tools/export-member-content.js .member-content-sync
          if [ -z "$ANNOUNCEMENT_CONTENT_SYNC_TOKEN" ] || [ -z "$ANNOUNCEMENT_CONTENT_SYNC_URL" ] || [ -z "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "ANNOUNCEMENT_CONTENT_SYNC_NOT_CONFIGURED"
          else
            for batch in .member-content-sync/batch-*.json; do
              response_file="$(mktemp)"
              http_status="$(curl --silent --show-error --output "$response_file" --write-out "%{http_code}" --request POST "$ANNOUNCEMENT_CONTENT_SYNC_URL" \
                --header "apikey: $SUPABASE_PUBLISHABLE_KEY" \
                --header "x-announcement-content-sync-token: $ANNOUNCEMENT_CONTENT_SYNC_TOKEN" \
                --header "content-type: application/json" \
                --data-binary "@$batch")"
              response_body="$(tr -d '\n' < "$response_file")"
              rm -f "$response_file"
              echo "announcement-content-sync batch=$(basename "$batch") status=$http_status response=$response_body"
              case "$http_status" in
                2??) ;;
                *) echo "::warning::announcement-content-sync failed (batch=$(basename "$batch") status=$http_status)" ; break ;;
              esac
            done
          fi

      - name: 移除公開產物中的會員內容
        run: node tools/public-metadata-projection.js docs

      - name: 同步可信提醒目標到 Supabase（已設定時）
        env:
          REMINDER_TARGET_SYNC_TOKEN: ${{ secrets.REMINDER_TARGET_SYNC_TOKEN }}
          REMINDER_TARGET_SYNC_URL: ${{ vars.REMINDER_TARGET_SYNC_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$REMINDER_TARGET_SYNC_TOKEN" ] || [ -z "$REMINDER_TARGET_SYNC_URL" ] || [ -z "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "REMINDER_TARGET_SYNC_NOT_CONFIGURED"
            exit 0
          fi
          curl --fail --silent --show-error --request POST "$REMINDER_TARGET_SYNC_URL" \
            --header "authorization: Bearer $SUPABASE_PUBLISHABLE_KEY" \
            --header "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            --header "x-reminder-target-sync-token: $REMINDER_TARGET_SYNC_TOKEN" \
            --header "content-type: application/json" \
            --data-binary @docs/data/reminder-targets.json

      - name: 提交更新後的資料
        run: |
          git config user.name "news-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs/data docs/calendar.ics scraper/coverage_gaps.json scraper/fetch_state.json scraper/notification_outbox.json
          if [ -d docs/data/details ]; then
            git add docs/data/details
          fi
          if [ -d docs/data/schools ]; then
            git add docs/data/schools
          fi
          if git diff --cached --quiet; then
            echo "沒有變更,略過提交"
          else
            git commit -m "更新公告 $(TZ=Asia/Taipei date +'%Y-%m-%d %H:%M')"
            git push
          fi

      - name: 抓取失敗時開 issue 通知
        if: failure() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="自動抓取失敗"
          number="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title $title" --json number,title --jq "map(select(.title == \"$title\")) | .[0].number // empty")"
          body="$(TZ=Asia/Taipei date +'%Y-%m-%d %H:%M') 的抓取失敗，網站資料暫停更新。執行紀錄：$RUN_URL"
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body（下一次成功時會自動關閉）"
          fi

      - name: 抓取恢復時關閉 issue
        if: success() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="自動抓取失敗"
          number="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title $title" --json number,title --jq "map(select(.title == \"$title\")) | .[0].number // empty")"
          if [ -n "$number" ]; then
            gh issue close "$number" --repo "$GITHUB_REPOSITORY" --comment "$(TZ=Asia/Taipei date +'%Y-%m-%d %H:%M') 抓取已恢復正常。"
          fi
