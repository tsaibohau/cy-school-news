name: 抓取兩校公告

on:
  push:
    branches: [main]
    paths:
      - "scraper/**"
      - ".github/workflows/scrape-hourly.yml"
  workflow_dispatch:
    inputs:
      fetch_all:
        description: "Fetch cold sources and history too"
        required: false
        default: true
        type: boolean
  workflow_call:
    inputs:
      fetch_all:
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    # A stuck source must not keep the shared scrape queue occupied and make
    # later scheduled runs appear stale to readers.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: 安裝相依套件
        run: pip install -r scraper/requirements.txt

      - name: 執行爬蟲
        env:
          # Direct manual runs may request a full crawl. The scheduled driver
          # keeps the established hot/cold behaviour by passing false.
          FETCH_ALL: ${{ inputs.fetch_all && '1' || '' }}
        run: python scraper/scrape.py

      - name: 推播新公告 (ntfy)
        env:
          # Secret first (topic URL or name), then legacy repository variable.
          # The value must never be echoed to Actions logs.
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC || vars.NTFY_TOPIC }}
          NTFY_URL: ${{ secrets.NTFY_URL || vars.NTFY_URL }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: python scraper/notify.py

      - name: 產生訂閱行事曆
        run: python scraper/schoolcal.py build

      - name: 產生可信提醒目標清單
        run: python scraper/reminder_targets.py

      - name: 同步可信提醒目標到 Supabase（已設定時）
        env:
          REMINDER_TARGET_SYNC_TOKEN: ${{ secrets.REMINDER_TARGET_SYNC_TOKEN }}
          REMINDER_TARGET_SYNC_URL: ${{ vars.REMINDER_TARGET_SYNC_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$REMINDER_TARGET_SYNC_TOKEN" ] || [ -z "$REMINDER_TARGET_SYNC_URL" ] || [ -z "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "REMINDER_TARGET_SYNC_NOT_CONFIGURED"
            exit 0
          fi
          curl --fail --silent --show-error --request POST "$REMINDER_TARGET_SYNC_URL" \
            --header "authorization: Bearer $SUPABASE_PUBLISHABLE_KEY" \
            --header "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            --header "x-reminder-target-sync-token: $REMINDER_TARGET_SYNC_TOKEN" \
            --header "content-type: application/json" \
            --data-binary @docs/data/reminder-targets.json

      - name: 提交更新後的資料
        run: |
          git config user.name "news-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/announcements.json docs/data/archive.json docs/data/calendar-events.json docs/data/reminder-targets.json docs/calendar.ics scraper/coverage_gaps.json scraper/fetch_state.json scraper/notification_outbox.json
          git add -A docs/data/details
          if [ -d docs/data/schools ]; then
            git add docs/data/schools
          fi
          if git diff --cached --quiet; then
            echo "沒有變更,略過提交"
          else
            git commit -m "更新公告 $(TZ=Asia/Taipei date +'%Y-%m-%d %H:%M')"
            git push
          fi
