name: 公告 token 補建（手動）

# Run by hand. Re-reads 嘉中、嘉女 notices that have no segment labels yet (newest first), so
# 問校務 can match questions segment by segment. Requests stay one at a time with the usual
# request_delay_sec pause; this workflow has no schedule. Body text goes only to the protected
# database; the public files get the labels (topics, kinds, dates, grades), never the text.
on:
  workflow_dispatch:
    inputs:
      count:
        description: "這次最多重讀幾則公告（上限 400）"
        required: false
        default: "300"
      pdfs:
        description: "最多讀幾個附件 PDF（上限 60）"
        required: false
        default: "30"

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  tokens:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      # Start from the newest main: this run waits behind the hourly scrape (same concurrency group).
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: 安裝相依套件
        run: pip install -r scraper/requirements.txt

      - name: 重讀公告內文
        env:
          BACKFILL_MODE: tokens
          DETAIL_BACKFILL_CAP: ${{ github.event.inputs.count }}
          ATTACHMENT_PDF_CAP: ${{ github.event.inputs.pdfs }}
        run: python scraper/detail_backfill.py

      - name: 同步內文到受保護資料庫
        env:
          ANNOUNCEMENT_CONTENT_SYNC_TOKEN: ${{ secrets.ANNOUNCEMENT_CONTENT_SYNC_TOKEN }}
          ANNOUNCEMENT_CONTENT_SYNC_URL: ${{ vars.ANNOUNCEMENT_CONTENT_SYNC_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          node tools/export-member-content.js .member-content-sync
          if [ -z "$ANNOUNCEMENT_CONTENT_SYNC_TOKEN" ] || [ -z "$ANNOUNCEMENT_CONTENT_SYNC_URL" ] || [ -z "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "ANNOUNCEMENT_CONTENT_SYNC_NOT_CONFIGURED"
            exit 1
          fi
          for batch in .member-content-sync/batch-*.json; do
            response_file="$(mktemp)"
            http_status="$(curl --silent --show-error --output "$response_file" --write-out "%{http_code}" --request POST "$ANNOUNCEMENT_CONTENT_SYNC_URL" \
              --header "apikey: $SUPABASE_PUBLISHABLE_KEY" \
              --header "x-announcement-content-sync-token: $ANNOUNCEMENT_CONTENT_SYNC_TOKEN" \
              --header "content-type: application/json" \
              --data-binary "@$batch")"
            response_body="$(tr -d '\n' < "$response_file")"
            rm -f "$response_file"
            echo "announcement-content-sync batch=$(basename "$batch") status=$http_status response=$response_body"
            case "$http_status" in
              2??) ;;
              *) echo "::error::announcement-content-sync failed (batch=$(basename "$batch") status=$http_status)"; exit 1 ;;
            esac
          done

      - name: 移除公開產物中的會員內容（留下段落標籤）
        run: node tools/public-metadata-projection.js docs

      - name: 統計
        run: |
          node -e '
          const d = require("./docs/data/announcements.json").items, a = require("./docs/data/archive.json").items;
          const all = d.concat(a).filter((i) => i.school === "cysh" || i.school === "cygsh");
          console.log("token 化：" + all.filter((i) => i.tokens).length + " / " + all.length + " 則（嘉中、嘉女）");'

      - name: 提交
        run: |
          git config user.name "news-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/announcements.json docs/data/archive.json docs/data/schools
          if git diff --cached --quiet; then
            echo "沒有變更,略過提交"
            exit 0
          fi
          git commit -q -m "公告 token 補建 $(TZ=Asia/Taipei date +'%Y-%m-%d %H:%M')"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            if ! git rebase -X theirs origin/main; then git rebase --abort || true; exit 1; fi
            sleep $((attempt * 5))
          done
          exit 1
