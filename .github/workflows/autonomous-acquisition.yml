name: Autonomous private content acquisition
on:
  push:
    branches: [codex/autonomous-corpus-acquisition]
    paths: [experiments/autonomous-corpus/acquire.py, experiments/autonomous-corpus/requirements.txt, experiments/autonomous-corpus/acquisition-trigger.json, experiments/autonomous-corpus/round2-qa-trigger.json]
permissions:
  contents: read
  id-token: write
concurrency:
  group: autonomous-private-acquisition
  cancel-in-progress: false
jobs:
  acquisition:
    if: ${{ !contains(github.event.head_commit.message, '[offline-only]') && !contains(github.event.head_commit.message, '[review-qa]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install bounded local parsers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq antiword poppler-utils tesseract-ocr tesseract-ocr-chi-tra
          python -m venv /tmp/corpus-env
          /tmp/corpus-env/bin/pip install -r experiments/autonomous-corpus/requirements.txt
          /tmp/corpus-env/bin/python -m playwright install --with-deps chromium
      - name: Verify parser invariants and unchanged scraper
        run: |
          /tmp/corpus-env/bin/python -m py_compile experiments/autonomous-corpus/acquire.py
          /tmp/corpus-env/bin/python tests/test_parser.py
      - name: Acquire two-school smoke and extend to frozen 30
        run: /tmp/corpus-env/bin/python -u experiments/autonomous-corpus/acquire.py
      # No artifact upload. Raw HTML, full body and attachments go only to private Storage.

  review-qa:
    if: ${{ contains(github.event.head_commit.message, '[review-qa]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install isolated browser QA runtime
        run: |
          python -m venv /tmp/review-qa-env
          /tmp/review-qa-env/bin/pip install requests==2.32.5 playwright==1.55.0
          /tmp/review-qa-env/bin/python -m playwright install --with-deps chromium
      - name: Synthetic controls and real queue read-only verification
        run: /tmp/review-qa-env/bin/python -u experiments/autonomous-corpus/round2_browser_qa.py
      # Screenshots/export proof/report only go to private Storage; no public artifact.
