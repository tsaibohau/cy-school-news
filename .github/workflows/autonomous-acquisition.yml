name: Autonomous private content acquisition
on:
  push:
    branches: [codex/autonomous-corpus-acquisition]
    paths: [experiments/autonomous-corpus/acquire.py, experiments/autonomous-corpus/requirements.txt, experiments/autonomous-corpus/acquisition-trigger.json]
permissions:
  contents: read
  id-token: write
concurrency:
  group: autonomous-private-acquisition
  cancel-in-progress: false
jobs:
  acquisition:
    if: ${{ !contains(github.event.head_commit.message, '[offline-only]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install bounded local parsers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq antiword poppler-utils tesseract-ocr tesseract-ocr-chi-tra
          python -m venv /tmp/corpus-env
          /tmp/corpus-env/bin/pip install -r experiments/autonomous-corpus/requirements.txt
          /tmp/corpus-env/bin/python -m playwright install --with-deps chromium
      - name: Verify parser invariants and unchanged scraper
        run: |
          /tmp/corpus-env/bin/python -m py_compile experiments/autonomous-corpus/acquire.py
          /tmp/corpus-env/bin/python tests/test_parser.py
      - name: Acquire two-school smoke and extend to frozen 30
        run: /tmp/corpus-env/bin/python -u experiments/autonomous-corpus/acquire.py
      # No artifact upload. Raw HTML, full body and attachments go only to private Storage.
