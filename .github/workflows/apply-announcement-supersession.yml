name: Apply ask-school supersession patch

on:
  push:
    branches: [codex/assistant-attachments-v2]
    paths:
      - tools/apply-announcement-supersession-patch.py
      - .github/workflows/apply-announcement-supersession.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: codex/assistant-attachments-v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply deterministic patch
        run: python tools/apply-announcement-supersession-patch.py
      - name: Run focused QA regression
        run: node tests/test_assistant_attachment_qa.js
      - name: Commit patched implementation
        run: |
          if git diff --quiet -- docs/assistant-qa.js tests/test_assistant_attachment_qa.js; then
            echo "PATCH_ALREADY_APPLIED"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/assistant-qa.js tests/test_assistant_attachment_qa.js
          git commit -m "fix: prefer newer corrected school notices"
          git push origin HEAD:codex/assistant-attachments-v2
