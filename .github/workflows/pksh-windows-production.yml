name: 同步北港高中公告

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pksh-production
  cancel-in-progress: false

jobs:
  sync:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install parser dependencies
        run: pip install -r scraper/requirements.txt
      - name: Verify PKSH contracts
        run: |
          python tests/test_pksh_adapter.py
          python tests/test_pksh_windows_handoff.py
          node tests/test_pksh_staging_overlay.js
      - name: Fetch complete PKSH metadata with Windows certificate validation
        shell: pwsh
        run: >-
          ./scraper/pksh_windows_fetch.ps1
          -OutputPath "$env:RUNNER_TEMP/pksh-list.json"
          -ReportPath "$env:RUNNER_TEMP/pksh-transport.json"
      - name: Prepare metadata-only snapshot
        shell: pwsh
        run: >-
          python tools/pksh_snapshot.py
          --html "$env:RUNNER_TEMP/pksh-list.json"
          --output "$env:RUNNER_TEMP/pksh-metadata.json"
      - name: Update production metadata without truncation
        shell: pwsh
        run: |
          git pull --rebase origin main
          node tools/pksh-staging-overlay.js docs "$env:RUNNER_TEMP/pksh-metadata.json"
          git config user.name "news-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/announcements.json docs/data/schools/pksh/current.json docs/data/schools/manifest.json
          if (git diff --cached --quiet) {
            Write-Host "PKSH production metadata is unchanged."
          } else {
            git commit -m "更新北港高中公告"
            git push origin HEAD:main
          }
      - name: Upload bounded transport evidence
        uses: actions/upload-artifact@v4
        with:
          name: pksh-production-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/pksh-transport.json
            ${{ runner.temp }}/pksh-metadata.json
          retention-days: 7
