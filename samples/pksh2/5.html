				<p><div><span style="font-size:26px;"><span style="font-family:微軟正黑體;">各位師長同仁大家好：</span></span></div><div><span style="font-size:26px;"><span style="font-family:微軟正黑體;">因應校園環境整理，</span></span></div><div><span style="font-size:26px;"><span style="font-family:微軟正黑體;">本<strong>週四(8/20)至週日(8/23)廠商將進行樹木修剪及清運</strong>相關工作，</span></span></div><div><span style="font-size:26px;"><span style="font-family:微軟正黑體;">因施作區域為全校性且有重型機具進駐，</span></span></div><div><span style="font-size:26px;"><span style="font-family:微軟正黑體;">請校內同仁務必遠離工作現場，</span></span></div><div><span style="font-size:26px;"><span style="font-family:微軟正黑體;">並請協助轉知學生，</span></span></div><div><span style="font-size:26px;"><span style="font-family:微軟正黑體;">以維護自身安全。</span></span></div><div> </div><div><span style="font-size:26px;"><span style="font-family:微軟正黑體;">造成困擾，</span></span></div><div><span style="font-size:26px;"><span style="font-family:微軟正黑體;">懇請見諒，</span></span></div><div><span style="font-size:26px;"><span style="font-family:微軟正黑體;">謝謝大家！</span></span></div></p>
