				<p><p>一、依據教育部114年9月5日臺教授國部字第1145404819號函辦理。</p><p>二、旨揭日程表係高級中等學校及專科學校五年制各入學管道辦理期程之重要憑據，請務必配合辦理。</p><p>三、另有關國中教育會考、高級中等學校、五專各入學管道詳細日程(包括註明截止日者)，以各區各入學管道招生簡章內容為準，請詳閱簡章。</p><p>四、另貴校舉行畢業典禮等重大活動之日期，請避免與高級中 等學校各入學管道報到同一日，以維護學生升學權益。</p></p>
