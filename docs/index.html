<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>嘉校快訊|嘉中・嘉女公告彙整</title>
<meta name="description" content="嘉義高中與嘉義女中官網最新公告即時彙整:段考、社團、升學、獎學金分類與關鍵字訂閱。非官方服務。">
<meta name="theme-color" content="#16233B">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="mast">
  <div class="wrap">
    <div class="mast-row">
      <div class="brand">
        <span class="seal" aria-hidden="true">訊</span>
        <h1>嘉校快訊</h1>
      </div>
      <button id="btnRefresh" class="icon-btn" title="重新整理" aria-label="重新整理">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
      </button>
    </div>
    <p class="mast-sub">嘉義高中・嘉義女中 官網公告彙整<span id="updatedAt" class="updated"></span></p>
  </div>
  <div class="rule-double" aria-hidden="true"></div>
</header>

<div class="wrap">

  <!-- 最新分頁 -->
  <section id="viewLatest">
    <div class="controls">
      <input id="q" type="search" inputmode="search" placeholder="搜尋公告,可用空格分隔多個關鍵字" aria-label="搜尋公告">
      <div class="seg" id="schoolSeg" role="tablist" aria-label="學校篩選"></div>
      <div class="chips" id="catChips" aria-label="分類篩選"></div>
    </div>
    <p id="countLine" class="count-line"></p>
    <main id="list" class="list"></main>
  </section>

  <!-- 訂閱分頁 -->
  <section id="viewSub" hidden>
    <div class="sub-head">
      <h2>我的訂閱</h2>
      <p class="hint">加入關鍵字(例如「段考」「社團」「獎學金」「熱舞」),符合的新公告會出現在這裡並標上紅點。</p>
      <form id="kwForm" class="kw-form">
        <input id="kwInput" type="text" maxlength="20" placeholder="輸入關鍵字後按新增" aria-label="新增訂閱關鍵字">
        <button type="submit" class="btn-primary">新增</button>
      </form>
      <div id="kwChips" class="kw-chips"></div>
      <div class="notify-row">
        <button id="btnNotify" class="btn-ghost">開啟瀏覽器通知</button>
        <span id="notifyState" class="hint"></span>
      </div>
    </div>
    <main id="subList" class="list"></main>
  </section>

  <footer class="foot">
    <p>資料來源:<a href="https://www.cysh.cy.edu.tw/" target="_blank" rel="noopener">嘉義高中</a>、<a href="https://www.cygsh.cy.edu.tw/" target="_blank" rel="noopener">嘉義女中</a>官方網站,每日自動更新數次。</p>
    <p><a href="calendar.ics">📅 訂閱行事曆</a>(開學、段考、模擬考等重要日程,可加入 iPhone/Google 行事曆)</p>
    <p>本站為個人非官方服務,內容以各校官網為準。</p>
  </footer>
</div>

<nav class="tabbar" aria-label="主要分頁">
  <button id="tabLatest" class="tab is-active" aria-current="page">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5h16M4 12h16M4 19h10"/></svg>
    <span>最新</span>
  </button>
  <button id="tabSub" class="tab">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
    <span>訂閱</span>
    <em id="subBadge" class="badge" hidden></em>
  </button>
</nav>

<script src="app.js"></script>
</body>
</html>
