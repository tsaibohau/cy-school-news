<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="referrer" content="no-referrer"><title>公告自主理解盲審</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#25352f;background:#f4f4ef}*{box-sizing:border-box}body{margin:0}main{max-width:850px;margin:auto;padding:24px 18px 210px}h1{font-size:22px;margin:0 0 8px}h2{font-size:23px;line-height:1.5}p{line-height:1.7}a{color:#27614a}small,.muted{color:#69766e}header{border-bottom:1px solid #d7ddd4;padding-bottom:18px}#status{font-size:14px;margin:10px 0}pre{white-space:pre-wrap;word-break:break-word;font-family:inherit;font-size:16px;line-height:1.8;margin:0}section{padding:20px 0;border-bottom:1px solid #d7ddd4}details{padding:14px 0}summary{cursor:pointer;font-weight:600;line-height:1.6}.locator{font-size:13px;color:#758077;margin:16px 0 4px}.dock{position:fixed;bottom:0;left:0;right:0;background:#f4f4eff5;border-top:1px solid #d7ddd4;padding:12px 16px calc(12px + env(safe-area-inset-bottom));backdrop-filter:blur(15px)}.dock>div{max-width:850px;margin:auto}.labels{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}button{cursor:pointer;border:1px solid #bac7bd;background:white;color:#26392c;border-radius:12px;padding:13px 10px;font:inherit;font-size:15px;min-height:46px}button.active{background:#27533c;color:white;border-color:#27533c}button:disabled{opacity:.45;cursor:default}.toolbar{display:flex;gap:8px;margin-top:9px}.toolbar button{flex:1;font-size:13px;min-height:40px;padding:8px}.progress{height:4px;background:#dce2da;margin-top:12px}.progress span{display:block;height:100%;background:#31553c;transition:width .2s}#error{color:#8e2e2e}.definitions{font-size:14px;line-height:1.7}#selected{font-size:13px;margin:8px 0 0}@media(min-width:700px){.labels{grid-template-columns:repeat(5,1fr)}}
</style></head><body><main><header><h1>公告自主理解盲審 · Batch A</h1><div class="muted">只要判斷重要程度。每批最多 15 筆，隨時可以離開。</div><div id="status">正在載入這批公告…</div><div class="progress"><span id="bar"></span></div><details><summary>五個選項怎麼選？</summary><div class="definitions">一定要看：剛發布且未讀，或近日直接影響你的行動。<br>有用：對你有用的開放機會，還不緊急。<br>可選讀：有參考價值，今天不急著看。<br>今天隱藏：已結束、過時或不符合你的身分。<br>不確定：內容不足、衝突或無法判断。<br>已過期但有參考價值，仍可在「今天」隱藏。</div></details></header><div id="error"></div><article id="record" hidden><div class="muted" id="persona"></div><h2 id="title"></h2><p><a id="source" target="_blank" rel="noopener noreferrer">前往校方原公告 ↗</a></p><section><strong>公告正文</strong><div id="body"></div></section><section><strong>附件可讀內容</strong><div id="attachments"></div></section></article></main><div class="dock"><div><div class="labels" id="labels"></div><div id="selected"></div><div class="toolbar"><button id="prev">上一筆</button><button id="next">下一筆</button><button id="undo">復原</button><button id="share">匯出／iPhone 分享</button></div></div></div><script>
'use strict';
const endpoint='https://sshovpnepgswzvjwjuyz.supabase.co/functions/v1/autonomous-review-gateway';
const labelDefs=[['must_show','一定要看'],['useful','有用'],['optional','可選讀'],['should_hide','今天隱藏'],['uncertain','不確定']];
const $=id=>document.getElementById(id);let batch=null,state=null,key=null,history=[];
const access=new URLSearchParams(location.hash.slice(1)).get('access');
function message(s){$('error').textContent=s;}
function save(){try{localStorage.setItem(key,JSON.stringify(state));return true;}catch{message('這個瀏覽器無法儲存進度，請匯出保存。');return false;}}
function textBlocks(container,units){container.replaceChildren();for(const unit of units){const loc=document.createElement('div');loc.className='locator';loc.textContent=unit.locator;const text=document.createElement('pre');text.textContent=unit.text;container.append(loc,text);}}
function render(){const r=batch.records[state.position];$('record').hidden=false;$('title').textContent=r.title;$('source').href=r.url;$('persona').textContent=`判斷日期：${batch.as_of} ｜ ${r.school==='cysh'?'嘉義高中':'嘉義女中'}高一學生 ｜ 公告未讀，未指定興趣，是否已報名未知`;
 textBlocks($('body'),r.body_content);$('attachments').replaceChildren();
 if(!r.attachment_content.length)$('attachments').textContent='校方頁面未發現附件。';
 for(const a of r.attachment_content){const d=document.createElement('details');d.open=true;const s=document.createElement('summary');s.textContent=a.filename;d.append(s);const content=document.createElement('div');if(a.content?.units?.length)textBlocks(content,a.content.units);else content.textContent='附件未能解析，判斷時請保留不確定性。';d.append(content);$('attachments').append(d);}
 const done=Object.keys(state.answers).length;$('status').textContent=`第 ${state.position+1}／${batch.records.length} 筆 · 已完成 ${done} 筆 · 自動儲存在這台裝置`;$('bar').style.width=`${done/batch.records.length*100}%`;
 $('prev').disabled=state.position===0;$('next').disabled=state.position===batch.records.length-1;$('undo').disabled=!history.length;
 for(const b of $('labels').children){b.classList.toggle('active',b.dataset.label===state.answers[r.id]?.label);b.setAttribute('aria-pressed',String(b.dataset.label===state.answers[r.id]?.label));b.disabled=false;}
 $('selected').textContent=state.answers[r.id]?`已選：${labelDefs.find(x=>x[0]===state.answers[r.id].label)[1]}。可直接點其他按鈕修改。`:'請選一個選項。';}
function choose(label){history.push(JSON.stringify(state));const r=batch.records[state.position];state.answers[r.id]={id:r.id,label,reviewed_at:new Date().toISOString()};save();render();}
for(const [label,text] of labelDefs){const b=document.createElement('button');b.textContent=text;b.dataset.label=label;b.disabled=true;b.onclick=()=>choose(label);$('labels').append(b);}
$('prev').onclick=()=>{if(state&&state.position>0){state.position--;save();render();scrollTo(0,0);}};$('next').onclick=()=>{if(state&&state.position<batch.records.length-1){state.position++;save();render();scrollTo(0,0);}};
$('undo').onclick=()=>{if(history.length){state=JSON.parse(history.pop());save();render();}};
$('share').onclick=async()=>{if(!batch)return;const data={schema_version:1,batch_id:batch.batch_id,corpus_sha256:batch.corpus_sha256,model_freeze_sha256:batch.model_freeze_sha256,as_of:batch.as_of,exported_at:new Date().toISOString(),completed:Object.keys(state.answers).length===batch.records.length,reviews:batch.records.map(r=>state.answers[r.id]).filter(Boolean)};const name='human_autonomous_v34_batch_a.json',blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),file=new File([blob],name,{type:'application/json'});
 try{if(navigator.canShare?.({files:[file]})){await navigator.share({files:[file],title:'公告盲審 Batch A'});return;}const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);}catch(e){if(e.name!=='AbortError')message('分享未成功，進度仍在這台裝置。請再按一次匯出。');}};
(async()=>{try{if(!access)throw new Error('請使用這批專用的完整連結開啟。此頁不需登入。');const r=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({access})});if(!r.ok)throw new Error('這批連結尚未開放或已到期。');batch=await r.json();if(batch.records.length>15)throw new Error('批次超過 15 筆，拒絕載入。');if(batch.records.some(r=>'label' in r||'model_label' in r||'citations' in r))throw new Error('資料含模型答案，拒絕載入。');key=`cyNews.autonomous.${batch.batch_id}.${batch.corpus_sha256}`;try{state=JSON.parse(localStorage.getItem(key));}catch{}if(!state)state={position:0,answers:{}};if(state.position>=batch.records.length)state.position=0;render();}catch(e){message(e.message);$('status').textContent='尚未載入公告';}})();
</script></body></html>
