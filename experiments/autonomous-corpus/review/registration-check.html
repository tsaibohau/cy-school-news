<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="referrer" content="no-referrer"><title>報名狀態二次核對</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#25352f;background:#f4f4ef}*{box-sizing:border-box}body{margin:0}main{max-width:850px;margin:auto;padding:24px 18px 160px}h1{font-size:22px}h2{font-size:21px;line-height:1.5}p{line-height:1.7}a{color:#27614a}small,.muted{color:#69766e}pre{white-space:pre-wrap;word-break:break-word;font:inherit;line-height:1.8}details{margin:12px 0}summary{cursor:pointer;line-height:1.7}.claim{background:white;border:1px solid #d7ddd4;border-radius:14px;margin:16px 0;padding:16px}.date{font-size:24px;font-weight:650;margin:10px 0}.choices{display:flex;flex-wrap:wrap;gap:7px}button{cursor:pointer;background:white;border:1px solid #bac7bd;border-radius:10px;padding:11px;color:#25352f;font:inherit;min-height:44px}button[aria-pressed=true]{background:#27533c;color:white}button:disabled{opacity:.45}.dock{position:fixed;bottom:0;left:0;right:0;background:#f4f4eff5;border-top:1px solid #d7ddd4;padding:12px 14px calc(12px + env(safe-area-inset-bottom))}.dock>div{max-width:850px;margin:auto;display:flex;gap:8px;flex-wrap:wrap}.dock button{flex:1}label{display:block;margin:12px 0;line-height:1.6}textarea{width:100%;min-height:150px}#error{color:#8e2e2e}.source{border-left:3px solid #a3b6a8;padding-left:12px;font-size:14px}.note{background:#eaf0e7;border-radius:12px;padding:12px;font-size:14px;line-height:1.8}
</style></head><body><main><h1>報名狀態二次核對 · Batch A</h1><p class="note">判斷日固定為 2026-10-02。本輪只判報名／申請提醒：開放且距截止 >5 天為有用；≤5 天為一定要看；尚未開放為可選讀；已截止為今天隱藏。多場次分開判，不以活動日期當報名日期。不判身分資格、已報名者後續或參考價值。</p><div id="status">正在載入…</div><div id="error"></div><article id="record" hidden><h2 id="title"></h2><p><a id="official" target="_blank" rel="noopener noreferrer">校方原公告 ↗</a></p><div id="dates"></div><label><input type="checkbox" id="missing"> 系統漏掉其他報名場次／期間</label><section id="feedback"></section><div id="conflicts"></div><details><summary>查看完整公告正文與附件</summary><div id="sources"></div></details></article><details><summary>JSON 文字備用匯出</summary><textarea id="exportText" readonly></textarea></details><p><a id="download" hidden>下載二次核對 JSON</a></p></main><div class="dock"><div><button id="prev" disabled>上一筆</button><button id="next" disabled>下一筆</button><button id="undo" disabled>復原</button><button id="share" disabled>匯出／分享</button></div></div><script>
'use strict';
/*PDF_DISPLAY*/
const endpoint='https://sshovpnepgswzvjwjuyz.supabase.co/functions/v1/autonomous-review-gateway';
const queueSHA='6b9c4aa93d7a354c60835ac4087c84772cf1091051e437cc5c7332f2d8cbeee5';
const purposes={'Official school publication date':'校方公告發布','Officer meeting':'社團幹部會議','Activity proposals':'活動企劃繳交','New officer list':'新幹部名單繳交','Annual evaluation':'年度評鑑','Gifted admission registration':'資優班報名','Initial assessment':'初選測驗','Second assessment':'複選測驗','Placement announcement':'錄取公告','Placement waiver':'放棄錄取','Lower-division registration closed':'低年級報名截止','Pre-event email window starts':'行前通知寄送期間開始','Pre-event email window ends':'行前通知寄送期間結束','Staff dependent-grant deadline':'教職員子女教育補助申請','School submission':'校內繳件','Foundation submission':'基金會收件','Annual results':'結果公告','Training registration':'培訓報名','Interview first day':'面試第一日','Interview second day':'面試第二日','Last final-presentation session':'最後成果發表場次','Teacher application':'商借教師申請','Secondment begins':'商借期間開始','Secondment term ends':'商借期間結束','Administrative nomination':'行政推薦','Teacher registration':'教師報名','Last listed training':'最後一場研習','Reading submission begins':'第一學期閱讀心得收件開始','Reading deadline':'第一學期閱讀心得截止','Short-paper deadline':'第一學期小論文截止','Second-semester submission begins':'第二學期收件開始','Second-semester reading deadline':'第二學期閱讀心得截止','Second-semester paper deadline':'第二學期小論文截止','Reading result due':'閱讀心得結果公告','Paper result due':'小論文結果公告','Award nominations begin':'總統教育獎推薦開始','Award nominations end':'總統教育獎推薦截止'};
const labels={must_show:'一定要看（must_show）',useful:'有用（useful）',optional:'可選讀／尚未開放（optional）',should_hide:'今天隱藏（should_hide）',unknown:'資訊不足',not_applicable:'非報名提醒'};
const $=id=>document.getElementById(id);let batch,state,key,history=[],blobURL;
function el(tag,text,parent){const e=document.createElement(tag);e.textContent=text;if(parent)parent.append(e);return e;}
function entry(){return state.answers[batch.records[state.position].id]||{verdict:null,corrected_label:null,reasons:[],missing_windows:false};}
function change(fn){history.push(JSON.stringify(state));const id=batch.records[state.position].id;state.answers[id]=fn(structuredClone(entry()));state.answers[id].reviewed_at=new Date().toISOString();save();render();}
function save(){try{localStorage.setItem(key,JSON.stringify(state));}catch{$('error').textContent='無法自動儲存，請匯出保存。';}}
function pick(parent,list,value,callback){const div=el('div','',parent);div.className='choices';for(const [code,text] of list){const b=el('button',text,div);b.setAttribute('aria-pressed',String(Array.isArray(value)?value.includes(code):value===code));b.onclick=()=>callback(code);}}
function reference(ref,parent){const div=el('details','',parent);el('summary',ref.filename+' · '+ref.locator,div);el('pre',ref.source_type==='attachment'?cleanPdfDisplay(ref.snippet):ref.snippet,div);if(ref.range_quote)el('p','起訖原句：'+ref.range_quote,div);}
function isDone(a){return !!a&&(a.verdict==='correct'||a.verdict==='incorrect'&&!!a.corrected_label);}
function render(){const r=batch.records[state.position],a=entry();$('record').hidden=false;$('title').textContent=r.title;$('official').href=r.url;$('dates').replaceChildren();
const total=batch.records.filter(r=>isDone(state.answers[r.id])).length;$('status').textContent='第 '+(state.position+1)+'／15 篇 · 已核對 '+total+'／15 · 自動儲存在這台裝置';
const result=r.registration_result;const box=el('section','',$('dates'));box.className='claim';el('strong','系統分類：'+labels[result.label||result.status],box);el('p','判定依據：'+result.reason,box);el('p','這是報名提醒分類，不是公告整體重要性。截止當日先按日期比較；精確時刻不確定時請指出。',box).className='muted';
for(const w of r.registration_windows){const c=el('section','',$('dates'));c.className='claim';el('strong',purposes[w.purpose]||w.purpose,c);el('p','開始：'+(w.start||'未知')+'　截止：'+w.end,c);el('p','分類：'+labels[w.decision.label||w.decision.status],c);el('p',w.decision.reason,c);el('p','開始日期依據：'+w.start_basis,c);for(const ref of w.references)reference(ref,c);if(w.start_evidence)reference(w.start_evidence,c);}
$('missing').checked=a.missing_windows;$('feedback').replaceChildren();el('h3','系統這樣分類對不對？',$('feedback'));
pick($('feedback'),[['correct','分類與依據正確'],['incorrect','我要修正']],a.verdict,v=>change(x=>{x.verdict=v;if(v==='correct'){x.corrected_label=null;x.reasons=[];}return x;}));
if(a.verdict==='incorrect'){el('p','你認為應該是：',$('feedback'));pick($('feedback'),Object.entries(labels),a.corrected_label,v=>change(x=>{x.corrected_label=v;return x;}));el('p','原因（可複選，不用打字）：',$('feedback'));pick($('feedback'),[['start','開始日期判錯'],['end','截止日期判錯'],['pairing','不同場次配錯'],['urgency','緊急程度判錯'],['not_registration','這不是報名時間'],['missing','漏掉報名場次'],['other','其他／依據不足']],a.reasons,v=>change(x=>{x.reasons=x.reasons.includes(v)?x.reasons.filter(y=>y!==v):[...x.reasons,v];return x;}));}
$('sources').replaceChildren();for(const u of r.body_content){el('small','正文 · '+u.locator,$('sources'));el('pre',u.text,$('sources'));}for(const att of r.attachment_content){el('h3',att.filename,$('sources'));for(const u of att.content?.units||[]){el('small',u.locator,$('sources'));el('pre',/\.pdf$/i.test(att.filename)?cleanPdfDisplay(u.text):u.text,$('sources'));}}
$('prev').disabled=state.position===0;$('next').disabled=state.position===14;$('undo').disabled=!history.length;$('share').disabled=false;prepare();}
function prepare(){const data={schema_version:1,review_kind:'post_blind_registration_policy',batch_id:batch.batch_id,queue_sha256:queueSHA,policy_version:batch.policy_version,as_of:batch.as_of,urgent_days:batch.urgent_days,corpus_sha256:batch.corpus_sha256,model_freeze_sha256:batch.model_freeze_sha256,time_human_sha256:batch.time_human_sha256,exported_at:new Date().toISOString(),completed:batch.records.every(r=>isDone(state.answers[r.id])),reviews:batch.records.map(r=>({id:r.id,...(state.answers[r.id]||{verdict:null,corrected_label:null,reasons:[],missing_windows:false})}))};const text=JSON.stringify(data,null,2);$('exportText').value=text;if(blobURL)URL.revokeObjectURL(blobURL);const f=new File([text],'human_round2_a_registration_rereview.json',{type:'application/json'});blobURL=URL.createObjectURL(f);$('download').href=blobURL;$('download').download=f.name;$('download').hidden=false;return f;}
$('prev').onclick=()=>{state.position--;save();render();scrollTo(0,0);};$('next').onclick=()=>{state.position++;save();render();scrollTo(0,0);};$('undo').onclick=()=>{if(history.length){state=JSON.parse(history.pop());save();render();}};$('missing').onchange=()=>{const v=$('missing').checked;change(x=>{x.missing_windows=v;return x;});};$('share').onclick=async()=>{try{const f=prepare();if(navigator.canShare?.({files:[f]}))await navigator.share({files:[f],title:'報名狀態二次核對'});else $('download').click();}catch(e){if(e.name!=='AbortError')$('error').textContent='請改用下載連結或 JSON 文字備用匯出。';}};
(async()=>{try{const access=new URLSearchParams(location.hash.slice(1)).get('access');if(!access)throw Error('請用二次核對專用完整連結，免登入。');const response=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({access})});if(!response.ok)throw Error('此批次無法讀取。');batch=await response.json();if(batch.review_kind!=='post_blind_registration_policy'||batch.records.length!==15)throw Error('批次不符合二次核對範圍。');key='cyNews.registration.'+batch.batch_id+'.'+queueSHA;try{state=JSON.parse(localStorage.getItem(key));}catch{}if(!state||!Number.isInteger(state.position)||state.position<0||state.position>=15||!state.answers)state={position:0,answers:{}};render();}catch(e){$('error').textContent=e.message;$('status').textContent='尚未載入';}})();
</script></body></html>
