<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="referrer" content="no-referrer"><title>公告時間核對</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#25352f;background:#f4f4ef}*{box-sizing:border-box}body{margin:0}main{max-width:850px;margin:auto;padding:24px 18px 160px}h1{font-size:22px}h2{font-size:21px;line-height:1.5}p{line-height:1.7}a{color:#27614a}small,.muted{color:#69766e}pre{white-space:pre-wrap;word-break:break-word;font:inherit;line-height:1.8}details{margin:12px 0}summary{cursor:pointer;line-height:1.7}.claim{background:white;border:1px solid #d7ddd4;border-radius:14px;margin:16px 0;padding:16px}.date{font-size:24px;font-weight:650;margin:10px 0}.choices{display:flex;flex-wrap:wrap;gap:7px}button{cursor:pointer;background:white;border:1px solid #bac7bd;border-radius:10px;padding:11px;color:#25352f;font:inherit;min-height:44px}button[aria-pressed=true]{background:#27533c;color:white}button:disabled{opacity:.45}.dock{position:fixed;bottom:0;left:0;right:0;background:#f4f4eff5;border-top:1px solid #d7ddd4;padding:12px 14px calc(12px + env(safe-area-inset-bottom))}.dock>div{max-width:850px;margin:auto;display:flex;gap:8px;flex-wrap:wrap}.dock button{flex:1}label{display:block;margin:12px 0;line-height:1.6}textarea{width:100%;min-height:150px}#error{color:#8e2e2e}.source{border-left:3px solid #a3b6a8;padding-left:12px;font-size:14px}.note{background:#eaf0e7;border-radius:12px;padding:12px;font-size:14px;line-height:1.8}
</style></head><body><main><h1>公告時間核對 · Batch A</h1><p class="note">重要性答案已提交並保存。這裡只核對模型當時找到的時間，不修改原盲測答案。公告可有多組時間；請分清報名、活動與發文日期。每組可選「正確」或指出問題，無須打字。</p><div id="status">正在載入…</div><div id="error"></div><article id="record" hidden><h2 id="title"></h2><p><a id="official" target="_blank" rel="noopener noreferrer">校方原公告 ↗</a></p><div id="dates"></div><label><input type="checkbox" id="missing"> 系統還漏掉了其他時間（含時刻或另一場次）</label><label><input type="checkbox" id="reviewed"> 這篇的時間核對完成</label><div id="conflicts"></div><details><summary>查看完整公告正文與附件</summary><div id="sources"></div></details></article><details><summary>JSON 文字備用匯出</summary><textarea id="exportText" readonly></textarea></details><p><a id="download" hidden>下載時間核對 JSON</a></p></main><div class="dock"><div><button id="prev" disabled>上一筆</button><button id="next" disabled>下一筆</button><button id="undo" disabled>復原</button><button id="share" disabled>匯出／分享</button></div></div><script>
'use strict';
/*PDF_DISPLAY*/
const endpoint='https://sshovpnepgswzvjwjuyz.supabase.co/functions/v1/autonomous-review-gateway';
const expectedQueue='fcead5fcc42fc44c015420374dcb3e5d715caed3fb9ddd72322adaea3900ccfe';
const kinds={publication_date:'公告發布日期',deadline:'截止日期',event_date:'活動／流程日期',application_start:'報名／收件開始',application_end:'報名／收件截止',effective_until:'有效期間結束'};
const purposes={'Official school publication date':'校方公告發布','Officer meeting':'社團幹部會議','Activity proposals':'活動企劃繳交','New officer list':'新幹部名單繳交','Annual evaluation':'年度評鑑','Gifted admission registration':'資優班報名','Initial assessment':'初選測驗','Second assessment':'複選測驗','Placement announcement':'錄取公告','Placement waiver':'放棄錄取','Lower-division registration closed':'低年級報名截止','Pre-event email window starts':'行前通知寄送期間開始','Pre-event email window ends':'行前通知寄送期間結束','Staff dependent-grant deadline':'教職員子女教育補助申請','School submission':'校內繳件','Foundation submission':'基金會收件','Annual results':'結果公告','Training registration':'培訓報名','Interview first day':'面試第一日','Interview second day':'面試第二日','Last final-presentation session':'最後成果發表場次','Teacher application':'商借教師申請','Secondment begins':'商借期間開始','Secondment term ends':'商借期間結束','Administrative nomination':'行政推薦','Teacher registration':'教師報名','Last listed training':'最後一場研習','Reading submission begins':'第一學期閱讀心得收件開始','Reading deadline':'第一學期閱讀心得截止','Short-paper deadline':'第一學期小論文截止','Second-semester submission begins':'第二學期收件開始','Second-semester reading deadline':'第二學期閱讀心得截止','Second-semester paper deadline':'第二學期小論文截止','Reading result due':'閱讀心得結果公告','Paper result due':'小論文結果公告','Award nominations begin':'總統教育獎推薦開始','Award nominations end':'總統教育獎推薦截止'};
const options=[['correct','正確'],['date_wrong','日期／年份錯'],['purpose_wrong','時間用途錯'],['source_unsupported','原文不支持'],['incomplete','時刻／範圍不完整'],['uncertain','看不出來']];
const $=id=>document.getElementById(id);let batch,state,key,history=[],url;
function msg(s){$('error').textContent=s;}
function save(){try{localStorage.setItem(key,JSON.stringify(state));}catch{msg('無法自動儲存，請匯出保存。');}}
function entry(){const id=batch.records[state.position].id;return state.records[id]||{claims:{},missing_dates:false,reviewed:false};}
function update(change){history.push(JSON.stringify(state));const id=batch.records[state.position].id;state.records[id]=change(structuredClone(entry()));state.records[id].reviewed_at=new Date().toISOString();save();render();}
function el(tag,text,parent){const x=document.createElement(tag);x.textContent=text;if(parent)parent.append(x);return x;}
function excerpt(ref,raw){const text=ref.source_type==='attachment'?cleanPdfDisplay(ref.snippet):ref.snippet;const compact=raw.replace(/\s/g,'');let chars='',positions=[];for(let i=0;i<text.length;i++)if(!/\s/.test(text[i])){positions.push(i);chars+=text[i];}const i=chars.indexOf(compact);return i<0?text.slice(0,900):text.slice(Math.max(0,positions[i]-150),Math.min(text.length,positions[i+compact.length-1]+250));}
function render(){const r=batch.records[state.position],answer=entry();$('record').hidden=false;$('title').textContent=r.title;$('official').href=r.url;$('dates').replaceChildren();
 const counts=batch.records.reduce((s,x)=>s+(state.records[x.id]?.reviewed?1:0),0);$('status').textContent=`第 ${state.position+1}／${batch.records.length} 篇 · 已核對 ${counts}／${batch.records.length} · 自動儲存在這台裝置`;
 const dates=[...r.temporal_claims.filter(d=>d.kind!=='publication_date'),...r.temporal_claims.filter(d=>d.kind==='publication_date')];
 if(!dates.length)el('p','模型當時沒有找到可確定的時間。若原文有時間，請勾選「系統還漏掉了其他時間」。',$('dates'));
 for(const d of dates){const box=el('section','',$('dates'));box.className='claim';el('strong',`${kinds[d.kind]||d.kind} · ${purposes[d.purpose]||d.purpose}`,box);const value=el('div',d.value,box);value.className='date';el('p',`原文寫法：${d.raw_value}`,box);if(d.year_basis)el('p','年份由同一段／同一活動脈絡補足，請連同出處核對。',box);el('p','目前整理的是日期；當天時刻與期間完整性請對照以下原文。',box).className='muted';
 for(const ref of d.references){const source=el('div','',box);source.className='source';el('strong',`${ref.source_type==='attachment'?'附件':ref.source_type==='body'?'正文':ref.source_type==='title'?'標題':'公告資訊'}：${ref.filename} · ${ref.locator}`,source);el('pre',excerpt(ref,d.raw_value),source);}
 const choices=el('div','',box);choices.className='choices';for(const [code,text] of options){const b=el('button',text,choices);b.setAttribute('aria-pressed',String(answer.claims[d.claim_id]===code));b.onclick=()=>update(a=>{a.claims[d.claim_id]=code;a.reviewed=false;return a;});}}
 $('missing').checked=answer.missing_dates;$('reviewed').checked=answer.reviewed;$('reviewed').disabled=dates.some(d=>!answer.claims[d.claim_id]);
 $('conflicts').replaceChildren();if(r.source_conflicts?.length){el('p','原始模型記錄指出來源有時間矛盾，請保留不確定性；核對不會覆寫模型原答案。',$('conflicts')).className='note';}
 $('sources').replaceChildren();for(const u of r.body_content){el('small',`正文 · ${u.locator}`,$('sources'));el('pre',u.text,$('sources'));}for(const a of r.attachment_content){el('h3',a.filename,$('sources'));for(const u of a.content?.units||[]){el('small',u.locator,$('sources'));el('pre',/\.pdf$/i.test(a.filename)?cleanPdfDisplay(u.text):u.text,$('sources'));}}
 $('prev').disabled=state.position===0;$('next').disabled=state.position===batch.records.length-1;$('undo').disabled=!history.length;$('share').disabled=false;prepare();}
function exportData(){return {schema_version:1,review_kind:'post_blind_temporal_diagnostic',batch_id:batch.batch_id,queue_sha256:expectedQueue,corpus_sha256:batch.corpus_sha256,model_freeze_sha256:batch.model_freeze_sha256,human_original_sha256:batch.human_original_sha256,as_of:batch.as_of,exported_at:new Date().toISOString(),completed:batch.records.every(r=>state.records[r.id]?.reviewed),reviews:batch.records.map(r=>({id:r.id,...(state.records[r.id]||{claims:{},missing_dates:false,reviewed:false})}))};}
function prepare(){const text=JSON.stringify(exportData(),null,2);$('exportText').value=text;if(url)URL.revokeObjectURL(url);const file=new File([text],'human_round2_v35_batch_a_time_check.json',{type:'application/json'});url=URL.createObjectURL(file);$('download').href=url;$('download').download=file.name;$('download').hidden=false;return file;}
 $('prev').onclick=()=>{state.position--;save();render();scrollTo(0,0);};$('next').onclick=()=>{state.position++;save();render();scrollTo(0,0);};$('undo').onclick=()=>{if(history.length){state=JSON.parse(history.pop());save();render();}};
 $('missing').onchange=()=>{const checked=$('missing').checked;update(a=>{a.missing_dates=checked;return a;});};$('reviewed').onchange=()=>{const checked=$('reviewed').checked;update(a=>{a.reviewed=checked;return a;});};
 $('share').onclick=async()=>{try{const file=prepare();if(navigator.canShare?.({files:[file]}))await navigator.share({files:[file],title:'公告時間核對'});else $('download').click();}catch(e){if(e.name!=='AbortError')msg('分享失敗，請使用下載或 JSON 文字備用匯出。');}};
 (async()=>{try{const access=new URLSearchParams(location.hash.slice(1)).get('access');if(!access)throw Error('請使用時間核對專用完整連結。此頁免登入。');const response=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({access})});if(!response.ok)throw Error('時間核對連結無法讀取或已到期。');batch=await response.json();if(batch.review_kind!=='post_blind_temporal_diagnostic'||!batch.human_labels_frozen||batch.records.length!==15||!['round2-v35-A-time-check','synthetic-time-check'].includes(batch.batch_id))throw Error('非已完成盲測的 A 批次，拒絕顯示模型時間。');key=`cyNews.timeCheck.${batch.batch_id}.${expectedQueue}`;try{state=JSON.parse(localStorage.getItem(key));}catch{}if(!state||!Number.isInteger(state.position)||state.position<0||state.position>=15||!state.records)state={position:0,records:{}};render();}catch(e){msg(e.message);$('status').textContent='尚未載入';}})();
</script></body></html>
