<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="referrer" content="no-referrer"><title>歷史參考價值逐段覆核</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#25352f;background:#f4f4ef}*{box-sizing:border-box}body{margin:0}main{max-width:850px;margin:auto;padding:24px 18px 160px}h1{font-size:22px}h2{font-size:21px;line-height:1.5}p{line-height:1.7}a{color:#27614a}small,.muted{color:#69766e}pre{white-space:pre-wrap;word-break:break-word;font:inherit;line-height:1.8}details{margin:12px 0}summary{cursor:pointer;line-height:1.7}.claim{background:white;border:1px solid #d7ddd4;border-radius:14px;margin:16px 0;padding:16px}.date{font-size:24px;font-weight:650;margin:10px 0}.choices{display:flex;flex-wrap:wrap;gap:7px}button{cursor:pointer;background:white;border:1px solid #bac7bd;border-radius:10px;padding:11px;color:#25352f;font:inherit;min-height:44px}button[aria-pressed=true]{background:#27533c;color:white}button:disabled{opacity:.45}.dock{position:fixed;bottom:0;left:0;right:0;background:#f4f4eff5;border-top:1px solid #d7ddd4;padding:12px 14px calc(12px + env(safe-area-inset-bottom))}.dock>div{max-width:850px;margin:auto;display:flex;gap:8px;flex-wrap:wrap}.dock button{flex:1}label{display:block;margin:12px 0;line-height:1.6}textarea{width:100%;min-height:150px}#error{color:#8e2e2e}.source{border-left:3px solid #a3b6a8;padding-left:12px;font-size:14px}.note{background:#eaf0e7;border-radius:12px;padding:12px;font-size:14px;line-height:1.8}

.tag{display:inline-block;border:1px solid #bcccbc;border-radius:8px;padding:5px 9px;margin:3px}.quote{font-size:14px;line-height:1.8;white-space:pre-wrap;overflow-wrap:anywhere}.selected{border-color:#27533c}.warning{background:#fff2d8;padding:12px;border-radius:10px;line-height:1.8}h3{font-size:18px}button.primary{background:#27533c;color:#fff}select{padding:10px;max-width:100%;border-radius:8px;font:inherit}.scope{font-size:14px;color:#56685c}</style></head><body><main>
<h1>歷史參考價值 · 逐段覆核</h1><p class="note">同一篇可以「辦法仍可參考、日期只適用原年度、名單只供特定查詢」。判斷日固定為 2026-10-03。這是已曝光 A 批的開發覆核；不改原 v3.5 答案與 Today 分類。新版、法規效力及外部連結尚未重新查核。</p>
<details><summary>這輪的判斷原則</summary><div id="rubric"></div></details><div id="status">正在載入…</div><div id="error"></div><article id="record" hidden><h2 id="title"></h2><p><a id="official" target="_blank" rel="noopener noreferrer">校方原公告 ↗</a></p><div id="overview"></div><div id="groups"></div><label><input type="checkbox" id="missing"> 系統漏掉其他可參考／失效內容</label><button id="accept" class="primary">本篇尚未核對的部分全部正確</button><details><summary>查看完整公告正文與附件</summary><div id="sources"></div></details></article><p><select id="jump" aria-label="跳到指定公告"></select></p><details><summary>JSON 文字備用匯出</summary><textarea id="exportText" readonly></textarea></details><p><a id="download" hidden>下載歷史參考覆核 JSON</a></p></main><div class="dock"><div><button id="prev" disabled>上一筆</button><button id="next" disabled>下一筆</button><button id="undo" disabled>復原</button><button id="share" disabled>匯出／分享</button></div></div><script>
'use strict';
/*PDF_DISPLAY*/
const endpoint='https://sshovpnepgswzvjwjuyz.supabase.co/functions/v1/autonomous-review-gateway';
const queueSHA='c50cff78109a8f3c3b97f5341b22eb388b91d8e16dc0c62b05496b7d41c8a24e';
const kinds={regulation_update:'法規修正',regulation_pointer:'法規查詢入口',regulation_citation:'規範引用',event_rules:'活動／申請辦法',procedure:'操作／行政流程',form:'表格樣式',one_off_notice:'當次事件通知',annual_threshold:'年度門檻',admission_roster:'錄取參賽隊伍名單',outcome:'得獎／升學結果',experience:'準備經驗',resource:'教學資源',source_conflict:'資料矛盾',cycle_timing:'原年度／場次時間'};
const recordKinds={regulation_update:'法規修正',notice:'通知',event_rules:'活動辦法',application:'申請／投稿',procedure:'流程',exam_reference:'年度考試資料',recruitment:'徵才',admission_roster:'錄取隊伍',training_notice:'培訓通知',regulation_citation:'規範引用',admission_results:'升學結果',award_results:'得獎名單',news:'成果新聞',experience:'準備經驗',teaching_resource:'教學資源'};
const reasons={rules_changed:'辦法可能已改',dates:'舊日期不能套本期',outcome:'名單用途判錯',law:'法規／通知判錯',scope:'年度／對象判錯',citation:'依據不足或引用錯誤',missing:'漏掉內容',other:'其他'};
const $=id=>document.getElementById(id);let batch,state,key,history=[],blobURL;
function el(tag,text,parent){const e=document.createElement(tag);e.textContent=text;if(parent)parent.append(e);return e;}
function recordAnswer(id){return state.answers[id]||{missing_groups:false,groups:{}};}
function groupAnswer(id,gid){return recordAnswer(id).groups[gid]||{verdict:null,corrected_class:null,corrected_kind:null,reasons:[]};}
function done(a){return !!a&&(a.verdict==='correct'||a.verdict==='incorrect'&&(a.corrected_class||a.corrected_kind||a.reasons?.length));}
function recordDone(r){return r.reference_analysis.groups.every(g=>done(groupAnswer(r.id,g.group_id)));}
function save(){try{localStorage.setItem(key,JSON.stringify(state));}catch{$('error').textContent='無法自動儲存，請匯出保存。';}}
function change(fn){history.push(JSON.stringify(state));fn();save();render();}
function updateGroup(id,gid,fn){change(()=>{state.answers[id]=structuredClone(recordAnswer(id));state.answers[id].groups[gid]=fn(structuredClone(groupAnswer(id,gid)));state.answers[id].groups[gid].reviewed_at=new Date().toISOString();});}
function pick(parent,list,value,fn){const div=el('div','',parent);div.className='choices';for(const [code,text] of list){const b=el('button',text,div);b.setAttribute('aria-pressed',String(Array.isArray(value)?value.includes(code):value===code));b.onclick=()=>fn(code);}}
function reference(ref,parent){const d=el('details','',parent);el('summary',(ref.filename||'公告')+' · '+(ref.locator||'title'),d);el('pre',ref.source_type==='attachment'?cleanPdfDisplay(ref.quote):ref.quote,d).className='quote';}
function render(){const r=batch.records[state.position],analysis=r.reference_analysis;$('record').hidden=false;$('title').textContent=r.title;$('official').href=r.url;
const total=batch.records.reduce((n,r)=>n+r.reference_analysis.groups.length,0),completed=batch.records.reduce((n,r)=>n+r.reference_analysis.groups.filter(g=>done(groupAnswer(r.id,g.group_id))).length,0);
$('status').textContent=`第 ${state.position+1}／15 篇 · 已完成 ${batch.records.filter(recordDone).length}／15 篇、${completed}／${total} 組 · 本機自動儲存`;
$('overview').replaceChildren();el('p',analysis.overview,$('overview'));const types=el('div','',$('overview'));for(const kind of analysis.content_kinds)el('span',recordKinds[kind]||kind,types).className='tag';el('p','查新版狀態：尚未查核。可參考 ≠ 仍有效，也不會直接提升 Today 重要性。',$('overview')).className='warning';
$('groups').replaceChildren();for(const g of analysis.groups){const a=groupAnswer(r.id,g.group_id),card=el('section','',$('groups'));card.className='claim'+(done(a)?' selected':'');el('h3',g.title,card);el('strong','系統分類：'+batch.reference_classes[g.reference_class],card);el('p','內容性質：'+(kinds[g.content_kind]||g.content_kind)+'｜適用範圍：'+g.scope,card).className='scope';el('p',g.summary,card);el('p','判定依據：'+g.reason,card);
el('p','適合回答：'+g.allowed_questions.join('；'),card);el('p','使用限制：'+g.limitations.join('；'),card).className='note';
if(g.temporal_facts?.length){const d=el('details','',card);el('summary','逐組時間與原場次',d);for(const f of g.temporal_facts)el('p',f.purpose+'：'+f.value+'（'+({past:'判斷日前的歷史日期',today:'判斷當日',future:'判斷日之後，不能說已過期'}[f.relation_to_as_of])+'）',d);}
for(const ref of g.references)reference(ref,card);
el('p','這部分的分類與依據對不對？',card);pick(card,[['correct','正確'],['incorrect','我要修正']],a.verdict,v=>updateGroup(r.id,g.group_id,x=>{x.verdict=v;if(v==='correct'){x.corrected_class=null;x.corrected_kind=null;x.reasons=[];}return x;}));
if(a.verdict==='incorrect'){el('p','可改參考性、內容性質，或勾選原因；不用打字。',card);pick(card,Object.entries(batch.reference_classes),a.corrected_class,v=>updateGroup(r.id,g.group_id,x=>{x.corrected_class=v;return x;}));const detail=el('details','',card);el('summary','修正內容性質（法規／通知／辦法等）',detail);pick(detail,Object.entries(kinds),a.corrected_kind,v=>updateGroup(r.id,g.group_id,x=>{x.corrected_kind=v;return x;}));pick(card,Object.entries(reasons),a.reasons,v=>updateGroup(r.id,g.group_id,x=>{x.reasons=x.reasons.includes(v)?x.reasons.filter(y=>y!==v):[...x.reasons,v];return x;}));}}
$('missing').checked=recordAnswer(r.id).missing_groups;$('accept').disabled=recordDone(r);$('sources').replaceChildren();for(const u of r.body_content){el('small','正文 · '+u.locator,$('sources'));el('pre',u.text,$('sources'));}for(const att of r.attachment_content){el('h3',att.filename,$('sources'));if(!att.content?.units?.length)el('p','此附件未取得可讀文字，不能作為已讀證據。',$('sources')).className='warning';for(const u of att.content?.units||[]){el('small',u.locator,$('sources'));el('pre',/\.pdf$/i.test(att.filename)?cleanPdfDisplay(u.text):u.text,$('sources'));}}
$('jump').replaceChildren();batch.records.forEach((r,i)=>{const o=el('option',`${i+1}. ${recordDone(r)?'✓':'待核對'} ${r.title.slice(0,28)}`,$('jump'));o.value=String(i);o.selected=i===state.position;});$('prev').disabled=state.position===0;$('next').disabled=state.position===14;$('undo').disabled=!history.length;$('share').disabled=false;prepare();}
function prepare(){const data={schema_version:1,review_kind:batch.review_kind,batch_id:batch.batch_id,queue_sha256:queueSHA,policy_version:batch.policy_version,policy_sha256:batch.policy_sha256,reference_prediction_sha256:batch.reference_prediction_sha256,as_of:batch.as_of,corpus_sha256:batch.corpus_sha256,model_freeze_sha256:batch.model_freeze_sha256,source_registration_queue_sha256:batch.source_registration_queue_sha256,registration_human_sha256:batch.registration_human_sha256,exported_at:new Date().toISOString(),completed:batch.records.every(recordDone),reviews:batch.records.map(r=>({id:r.id,missing_groups:recordAnswer(r.id).missing_groups,groups:r.reference_analysis.groups.map(g=>({group_id:g.group_id,...groupAnswer(r.id,g.group_id)}))}))};const text=JSON.stringify(data,null,2);$('exportText').value=text;if(blobURL)URL.revokeObjectURL(blobURL);const f=new File([text],'human_round2_a_reference_review.json',{type:'application/json'});blobURL=URL.createObjectURL(f);$('download').href=blobURL;$('download').download=f.name;$('download').hidden=false;return f;}
function navigate(position){state.position=position;save();render();scrollTo(0,0);}
$('prev').onclick=()=>navigate(state.position-1);$('next').onclick=()=>navigate(state.position+1);$('jump').onchange=()=>navigate(Number($('jump').value));$('undo').onclick=()=>{if(history.length){state=JSON.parse(history.pop());save();render();}};
$('missing').onchange=()=>{const id=batch.records[state.position].id,v=$('missing').checked;change(()=>{state.answers[id]=structuredClone(recordAnswer(id));state.answers[id].missing_groups=v;});};
$('accept').onclick=()=>{const r=batch.records[state.position];change(()=>{state.answers[r.id]=structuredClone(recordAnswer(r.id));for(const g of r.reference_analysis.groups)if(!groupAnswer(r.id,g.group_id).verdict)state.answers[r.id].groups[g.group_id]={verdict:'correct',corrected_class:null,corrected_kind:null,reasons:[],reviewed_at:new Date().toISOString()};});};
$('share').onclick=async()=>{try{const f=prepare();if(navigator.canShare?.({files:[f]}))await navigator.share({files:[f],title:'歷史參考價值覆核'});else $('download').click();}catch(e){if(e.name!=='AbortError')$('error').textContent='請改用下載連結或 JSON 文字備用匯出。';}};
(async()=>{try{const access=new URLSearchParams(location.hash.slice(1)).get('access');if(!access)throw Error('請用歷史參考覆核專用完整連結，免登入。');const response=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({access})});if(!response.ok)throw Error('此批次無法讀取。');batch=await response.json();if(batch.review_kind!=='post_blind_reference_development'||batch.records.length!==15||batch.policy_version!=='historical-reference-v1')throw Error('批次不符合本輪範圍。');const bytes=new TextEncoder().encode(JSON.stringify(batch));const actual=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',bytes))).map(x=>x.toString(16).padStart(2,'0')).join('');if(actual!==queueSHA)throw Error('資料內容與已鎖定版本不一致，停止載入。');for(const rule of batch.rubric)el('p',rule,$('rubric'));key='cyNews.reference.'+batch.batch_id+'.'+queueSHA;try{state=JSON.parse(localStorage.getItem(key));}catch{}if(!state||!Number.isInteger(state.position)||state.position<0||state.position>=15||!state.answers)state={position:0,answers:{}};render();}catch(e){$('error').textContent=e.message;$('status').textContent='尚未載入';}})();
</script></body></html>
