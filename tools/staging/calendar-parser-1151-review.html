<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>PR #29 行事曆候選驗收</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="calendar-parser-1151-review.css">
</head>
<body>
  <div class="candidate-banner" role="alert">
    <strong>驗收資料，不是正式公開資料</strong>
    <span>PR #29 candidate-only review path；不會寫入正式行事曆。</span>
  </div>
  <main class="wrap candidate-review">
    <header class="section-heading candidate-heading">
      <div>
        <p class="eyebrow">PR #29 · CANDIDATE REVIEW</p>
        <h1>官方行事曆人工驗收</h1>
        <p class="hint">使用正式站相同的月格、跨日包含與日期 agenda 邏輯。</p>
      </div>
      <a class="btn-ghost" href="./">返回 Preview 首頁</a>
    </header>

    <section class="candidate-controls" aria-label="驗收篩選">
      <label>學校
        <select id="schoolFilter">
          <option value="all">CYSH + CYGSH</option>
          <option value="cysh">CYSH 嘉義高中</option>
          <option value="cygsh">CYGSH 嘉義女中</option>
        </select>
      </label>
      <div class="review-jumps" aria-label="重點疑點捷徑">
        <button type="button" class="btn-soft" data-jump="cysh|2027-01-01">CYSH「元旦放」</button>
        <button type="button" class="btn-soft" data-jump="cygsh|2026-09-29">CYGSH 三筆重複</button>
        <button type="button" class="btn-soft" data-jump="cysh|2026-09-02">CYSH 跨日範例</button>
      </div>
    </section>

    <div class="review-months" aria-label="指定驗收月份">
      <span>快速切換：</span>
      <button type="button" data-month="2026-09">2026-09</button>
      <button type="button" data-month="2026-10">2026-10</button>
      <button type="button" data-month="2026-11">2026-11</button>
      <button type="button" data-month="2026-12">2026-12</button>
      <button type="button" data-month="2027-01">2027-01</button>
    </div>

    <p id="loadState" class="candidate-state" role="status">載入 candidate…</p>
    <section id="calendarReview" hidden>
      <div class="calendar-toolbar">
        <button id="prevMonth" class="icon-btn" type="button" aria-label="上個月">‹</button>
        <h2 id="calendarTitle"></h2>
        <button id="nextMonth" class="icon-btn" type="button" aria-label="下個月">›</button>
      </div>
      <p id="monthCount" class="hint candidate-count"></p>
      <div id="calendarGrid" class="calendar-grid" aria-label="候選月曆"></div>

      <div class="agenda-heading">
        <h3 id="agendaTitle"></h3>
        <span class="hint">點日期查看；跨日事件會出現在涵蓋的每一天</span>
      </div>
      <div id="agenda" class="agenda"></div>

      <details class="candidate-inventory" open>
        <summary><strong>本月候選清單</strong> <span id="inventoryCount" class="hint"></span></summary>
        <div id="monthInventory" class="candidate-list"></div>
      </details>
    </section>
  </main>
  <script src="calendar-parser-1151-review.js" defer></script>
</body>
</html>
