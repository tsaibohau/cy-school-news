<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta http-equiv="Cache-Control" content="no-store">
<title>設定 Review Station 密碼</title>
<style>
:root{font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;color:#182238;background:#f4f6fb;--line:#dce3ef;--blue:#2448a5;--muted:#68748a}
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:18px 12px}.wrap{max-width:520px;margin:7vh auto}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:0 4px 18px #18304d0a}h1{font-size:1.3rem;margin:0 0 10px}.muted{color:var(--muted);line-height:1.55}.status{margin:14px 0;padding:11px 12px;border-radius:10px;background:#edf4ff;line-height:1.5;overflow-wrap:anywhere}.status.error{background:#fff0f0;color:#922929}.status.ok{background:#e2f4ec;color:#146b50}label{display:block;margin:14px 0 6px;font-weight:650}input{width:100%;min-height:48px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit}button{width:100%;margin-top:16px;min-height:48px;border:0;border-radius:11px;background:var(--blue);color:#fff;font:inherit;font-weight:750;cursor:pointer}button:disabled{opacity:.55;cursor:wait}a{color:var(--blue)}
</style>
</head>
<body>
<main class="wrap"><section class="card">
<h1>設定 Review Station 登入密碼</h1>
<p class="muted">此頁只供已登入的核准 reviewer 使用。密碼只從此頁傳送至 Training Supabase；不會寫入本機儲存或 URL。成功後一次性 setter 會立即失效。</p>
<div id="status" class="status" role="status">正在確認目前 Review Station session…</div>
<form id="passwordForm" hidden autocomplete="off">
<label for="password">新密碼（至少 12 字元）</label>
<input id="password" type="password" minlength="12" maxlength="72" autocomplete="new-password" required>
<label for="confirm">再次輸入新密碼</label>
<input id="confirm" type="password" minlength="12" maxlength="72" autocomplete="new-password" required>
<button id="submit" type="submit">設定密碼並驗證登入</button>
</form>
<p class="muted"><a href="/">返回 Review Station</a></p>
</section></main>
<script src="./station-config.js"></script>
<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2.57.4";
"use strict";
(async()=>{
 const TARGET="f0e28775-e740-4d40-bab6-52cd289db5af";
 const FUNCTION="reviewer-password-set-once";
 const cfg=window.CLOUD_REVIEW_CONFIG;
 const status=document.getElementById("status");
 const form=document.getElementById("passwordForm");
 const passwordInput=document.getElementById("password");
 const confirmInput=document.getElementById("confirm");
 const button=document.getElementById("submit");
 const say=(message,kind="")=>{status.textContent=message;status.className="status"+(kind?" "+kind:"")};
 const clearInputs=()=>{passwordInput.value="";confirmInput.value="";};
 if(!cfg||!cfg.supabaseUrl||!cfg.publishableKey){say("Training Supabase 設定不存在；未執行任何操作。","error");return;}
 const supabase=createClient(cfg.supabaseUrl,cfg.publishableKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
 const {data:sessionData,error:sessionError}=await supabase.auth.getSession();
 if(sessionError||!sessionData.session){say("此瀏覽器沒有同一個 Review Station 的登入 session。請回 Review Station 使用目前已登入的同一個網域；本頁不會寄送登入信。","error");return;}
 const {data:userData,error:userError}=await supabase.auth.getUser(sessionData.session.access_token);
 const user=userData?.user;
 if(userError||user?.id!==TARGET){say("目前登入的帳號不是指定 reviewer UID；沒有修改任何帳號。","error");return;}
 say("已確認指定 reviewer session。輸入新密碼後，伺服器會設定密碼，再以該密碼驗證登入與核准狀態；不會寄送 email。","ok");
 form.hidden=false;
 form.addEventListener("submit",async event=>{
   event.preventDefault();
   let password=passwordInput.value;
   const confirmation=confirmInput.value;
   if(password.length<12||password.length>72){password="";say("密碼需為 12–72 個字元。","error");return;}
   if(password!==confirmation){password="";say("兩次輸入不一致，請再確認。","error");return;}
   button.disabled=true;
   say("正在由 Training Supabase 設定密碼…");
   let setterError=null;
   try{
     const result=await supabase.functions.invoke(FUNCTION,{body:{password}});
     setterError=result.error||(!result.data?.ok?new Error("setter_failed"):null);
   }catch{setterError=new Error("network_error");}
   clearInputs();
   if(setterError){
     password="";
     button.disabled=false;
     say("密碼設定未完成；請確認連線後再試。沒有寄送 email。若頁面指出 setter 已使用，請停止並聯絡管理者。","error");
     return;
   }
   form.hidden=true;
   say("密碼已設定。正在使用新密碼驗證登入與 reviewer 權限…","ok");
   let verified=false;
   try{
     const {data:authData,error:authError}=await supabase.auth.signInWithPassword({email:user.email,password});
     if(!authError&&authData.user?.id===TARGET){
       const {data:approved,error:approvalError}=await supabase.rpc("is_approved_reviewer");
       verified=!approvalError&&approved===true;
     }
   }catch{}
   password="";clearInputs();
   if(verified){
     say("完成：Email + password 登入與 reviewer 核准狀態均驗證成功。此瀏覽器已更新為新登入 session；回到 Review Station 即可繼續。一次性 setter 已失效。","ok");
     button.disabled=true;
   }else{
     say("密碼已設定且一次性 setter 已失效，但登入或 reviewer 權限驗證未成功。請不要寄送 Magic Link；既有頁面 session 可能需要用新密碼重新登入。","error");
     button.disabled=true;
   }
 });
})().catch(()=>{const s=document.getElementById("status");s.textContent="頁面初始化失敗；未觸發 email。";s.className="status error";});
</script>
</body>
</html>
