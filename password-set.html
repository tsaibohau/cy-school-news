<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta http-equiv="Cache-Control" content="no-store">
<title>設定 Review Station 密碼</title>
<style>
:root{font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;color:#182238;background:#f4f6fb;--line:#dce3ef;--blue:#2448a5;--muted:#68748a}
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:18px 12px}.wrap{max-width:520px;margin:7vh auto}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:0 4px 18px #18304d0a}h1{font-size:1.3rem;margin:0 0 10px}.muted{color:var(--muted);line-height:1.55}.status{margin:14px 0;padding:11px 12px;border-radius:10px;background:#edf4ff;line-height:1.5;overflow-wrap:anywhere}.status.error{background:#fff0f0;color:#922929}.status.ok{background:#e2f4ec;color:#146b50}label{display:block;margin:14px 0 6px;font-weight:650}input{width:100%;min-height:48px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit}button{width:100%;margin-top:16px;min-height:48px;border:0;border-radius:11px;background:var(--blue);color:#fff;font:inherit;font-weight:750;cursor:pointer}button:disabled{opacity:.55;cursor:wait}a{color:var(--blue)}
</style>
</head>
<body>
<main class="wrap"><section class="card">
<h1>設定 Review Station 登入密碼</h1>
<p class="muted">此頁只供已登入的核准 reviewer 使用。密碼只從此頁傳送至 Training Supabase；不會寫入本機儲存或 URL。成功後一次性 setter 會立即失效。</p>
<div id="status" class="status" role="status">正在確認目前 Review Station session…</div>
<form id="passwordForm" hidden autocomplete="off">
<label for="password">新密碼（至少 12 字元）</label>
<input id="password" type="password" minlength="12" maxlength="72" autocomplete="new-password" required>
<label for="confirm">再次輸入新密碼</label>
<input id="confirm" type="password" minlength="12" maxlength="72" autocomplete="new-password" required>
<button id="submit" type="submit">設定密碼並驗證登入</button>
</form>
<p class="muted"><a href="/">返回 Review Station</a></p>
</section></main>
<script src="./station-config.js"></script>
<script>
"use strict";
(async()=>{
 const TARGET="f0e28775-e740-4d40-bab6-52cd289db5af";
 const FUNCTION="reviewer-password-set-once";
 const cfg=window.CLOUD_REVIEW_CONFIG;
 const status=document.getElementById("status");
 const form=document.getElementById("passwordForm");
 const passwordInput=document.getElementById("password");
 const confirmInput=document.getElementById("confirm");
 const button=document.getElementById("submit");
 const say=(message,kind="")=>{status.textContent=message;status.className="status"+(kind?" "+kind:"")};
 const clearInputs=()=>{passwordInput.value="";confirmInput.value="";};
 if(!cfg||!cfg.supabaseUrl||!cfg.publishableKey){say("Training Supabase 設定不存在；未執行任何操作。","error");return;}
 const projectRef=new URL(cfg.supabaseUrl).hostname.split(".")[0];
 let session;
 try{
   const raw=localStorage.getItem("sb-"+projectRef+"-auth-token");
   const parsed=raw?JSON.parse(raw):null;
   session=parsed?.access_token?parsed:(parsed?.currentSession||parsed?.session||null);
 }catch{}
 if(!session?.access_token){say("此瀏覽器沒有同一個 Review Station 的登入 session。請回 Review Station 使用目前已登入的同一個網域；本頁不會寄送登入信。","error");return;}
 let user;
 try{
   const response=await fetch(cfg.supabaseUrl+"/auth/v1/user",{headers:{apikey:cfg.publishableKey,Authorization:"Bearer "+session.access_token}});
   if(!response.ok)throw new Error();
   user=await response.json();
 }catch{say("無法確認登入 session；沒有修改密碼，也沒有寄送 email。","error");return;}
 if(user?.id!==TARGET){say("目前登入的帳號不是指定 reviewer UID；沒有修改任何帳號。","error");return;}
 say("已確認指定 reviewer session。輸入新密碼後，頁面會直接測試 Email + password 登入，不會寄送 email。","ok");
 form.hidden=false;
 form.addEventListener("submit",async event=>{
   event.preventDefault();
   const password=passwordInput.value;
   const confirmation=confirmInput.value;
   if(password.length<12||password.length>72){say("密碼需為 12–72 個字元。","error");return;}
   if(password!==confirmation){say("兩次輸入不一致，請再確認。","error");return;}
   button.disabled=true;
   say("正在由 Training Supabase 設定密碼…");
   let updateResponse;
   try{
     updateResponse=await fetch(cfg.supabaseUrl+"/functions/v1/"+FUNCTION,{
       method:"POST",
       headers:{apikey:cfg.publishableKey,Authorization:"Bearer "+session.access_token,"Content-Type":"application/json"},
       body:JSON.stringify({password})
     });
   }catch{
     clearInputs();button.disabled=false;say("無法連線到 Training Supabase；請重試。密碼未存入頁面儲存。","error");return;
   }
   clearInputs();
   if(!updateResponse.ok){
     button.disabled=false;
     const result=await updateResponse.json().catch(()=>({}));
     say(result.error==="setter_already_used"?"一次性 setter 已使用，不能再次設定。":result.error==="reviewer_not_allowed"?"登入身份不符；密碼未變更。":"密碼設定失敗；沒有觸發 email。","error");
     if(result.error==="setter_already_used")form.hidden=true;
     return;
   }
   form.hidden=true;
   say("密碼已設定。現在以不保存 session 的方式驗證 Email + password…","ok");
   let verified=false;
   try{
     const response=await fetch(cfg.supabaseUrl+"/auth/v1/token?grant_type=password",{
       method:"POST",
       headers:{apikey:cfg.publishableKey,"Content-Type":"application/json"},
       body:JSON.stringify({email:user.email,password})
     });
     const result=await response.json();
     verified=response.ok&&result.user?.id===TARGET&&typeof result.access_token==="string";
     result.access_token="";
     result.refresh_token="";
   }catch{}
   session=null;user=null;
   if(verified)say("完成：指定 reviewer 的 Email + password 登入驗證成功。一次性 setter 已失效；現有 Review Station session 沒有被登出。","ok");
   else say("密碼設定已完成，一次性 setter 已失效；但登入驗證未成功。請不要使用 Magic Link。","error");
   button.disabled=true;
 });
})().catch(()=>{const s=document.getElementById("status");s.textContent="頁面初始化失敗；未觸發 email。";s.className="status error";});
</script>
</body>
</html>
